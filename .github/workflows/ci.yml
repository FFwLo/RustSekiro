name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch or pull request cancels the older run (the Windows build is long).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -I tools/guard.py selftest
      # Blocked words come from a repository secret (empty on pull requests from forks; the owner's review covers those).
      - name: guard over the pull request's diff
        if: github.event_name == 'pull_request'
        env:
          GUARD_BLOCKED_WORDS: ${{ secrets.GUARD_BLOCKED_WORDS }}
        run: python -I tools/guard.py diff origin/${{ github.base_ref }}
      - name: guard over the pushed commits
        if: github.event_name == 'push'
        env:
          GUARD_BLOCKED_WORDS: ${{ secrets.GUARD_BLOCKED_WORDS }}
        run: python -I tools/guard.py diff ${{ github.event.before }}

  # A pull request that says "Board: <ID> done|part:" fails when someone else holds that row (or its whole row or
  # one of its parts) on the claims issue, so nobody lands work on a row another person is doing.
  claim:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - run: git fetch -q origin agents-work-board:refs/remotes/origin/agents-work-board
      - name: the row is free or this author's
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ github.event.pull_request.body }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          ID=$(python -c "import os,re; m=re.search(r'^Board:\s*([A-Z]\d+[a-z]?)\s+(?:done|part)\b', os.environ.get('BODY') or '', re.M); print(m.group(1) if m else '')")
          if [ -z "$ID" ]; then echo "no Board line: nothing to check"; exit 0; fi
          git show origin/agents-work-board:board.py | python - holder "$ID" "$AUTHOR"

  build-and-test:
    runs-on: windows-latest
    env:
      # .cargo/config.toml builds through sccache; the action installs it and keeps its cache on GitHub.
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9
      - run: cargo build --workspace
      # No extracted/ here: the tests that read the game's data are ignored (cfg shinobi_data, build.rs)
      # and the sim tests, which all play the game's data, are skipped. Contributors run everything
      # locally with their own data (docs/CONTRIBUTING.md). crates/game and crates/sim read the map cache
      # (SEKIRO_CACHE), so CI only builds their tests (board row B7).
      - run: cargo test --workspace --no-run
      - run: "cargo test -p sv1 -p sekiro-formats -p sekiro-hks -p sr-extract -- --skip sim_tests::"
