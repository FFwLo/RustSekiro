[package]
name = "sv1"
version = "0.2.1"
edition = "2024"

[dependencies]
bevy = { version = "0.19.1", features = ["dds"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
libloading = "0.8"
# The window icon (src/icon.rs); the version Bevy 0.19 itself uses.
winit = "0.30"
# Release build (main.rs): attach the parent console, the "Sv1 stopped" dialog on a panic.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }

# Light optimization for our own code, so rebuilds stay fast.
[profile.dev]
opt-level = 1

# Full optimization for libraries (Bevy etc.). They are compiled once and
# cached, and without this the game runs very slowly in debug builds.
[profile.dev.package."*"]
opt-level = 3

# The packaged build (tools/package.ps1: `cargo build --profile dist`): whole-program
# optimisation and no symbols. Not the everyday `--release`, which stays quick to rebuild.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
