[package]
name = "sv1"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19.1", features = ["dds"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
libloading = "0.8"

# Light optimization for our own code, so rebuilds stay fast.
[profile.dev]
opt-level = 1

# Full optimization for libraries (Bevy etc.). They are compiled once and
# cached, and without this the game runs very slowly in debug builds.
[profile.dev.package."*"]
opt-level = 3
