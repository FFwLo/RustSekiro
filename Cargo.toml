[package]
name = "sv1"
version = "0.2.1"
edition = "2024"

# The game is a library too (src/lib.rs), so another Bevy app can use it; sv1 is its program.
[lib]
name = "rustsekiro"
path = "src/lib.rs"

[[bin]]
name = "sv1"
path = "src/main.rs"
required-features = ["host"]

[features]
# The whole game (window, map, HUD, menus, sound; the `sv1` program). Off, the library is the
# combat core alone for another Bevy game (lib.rs `CombatCorePlugin`).
default = ["host"]
# The camera and the debug menu for another Bevy game that hosts the core (sekiro-rs's
# `--rustsekiro` mode): no map, HUD, menus or sound of ours.
embed = ["dep:libloading"]
host = ["embed", "dep:sekiro-game", "dep:sekiro-sim", "dep:libloading", "dep:winit", "dep:windows-sys"]

[dependencies]
bevy = { version = "0.20.0", features = ["dds"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
libloading = { version = "0.8", optional = true }
# AKJama's sekiro-rs as a library: its streaming map, lighting, sky and fog under
# `SHINOBI_SR_MAP=1` (src/sr_map.rs). Built from the local clone next to this repo (branch
# local/game-lib, [patch] below); the git source lets sekiro-rs's game take this crate in.
sekiro-game = { git = "https://github.com/AKJama/sekiro-rs", optional = true }
sekiro-sim = { git = "https://github.com/AKJama/sekiro-rs", optional = true }
# Its file readers (the draw params' GPARAM for the tests that check his lighting).
sekiro-formats = { git = "https://github.com/AKJama/sekiro-rs" }
# AKJama's HavokScript VM (sekiro-rs crates/hks): runs the game's compiled scripts from
# extracted/action/script, the bytecode the game itself runs (src/hks.rs HksVm).
sekiro-hks = { git = "https://github.com/AKJama/sekiro-rs" }
# The window icon (src/icon.rs); the version Bevy 0.20 itself uses.
winit = { version = "0.30", optional = true }
# Release build (main.rs): attach the parent console, the "Sv1 stopped" dialog on a panic.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_UI_WindowsAndMessaging"], optional = true }

# The shader tests (src/shader_tests.rs) validate the composed shaders with naga, through the
# wgpu Bevy 0.20 already uses.
[dev-dependencies]
wgpu = { version = "30", default-features = false }
# Standard Lua 5.1 (built from source) for the game's own player script, decompiled HKS
# (src/hks_lua.rs, a trial run by the tests only for now).
mlua = { version = "0.12.2", features = ["lua51", "vendored"] }

# This repo built on its own takes sekiro-rs from the clone next to it (a game that takes this
# crate in uses its own copy).
[patch."https://github.com/AKJama/sekiro-rs"]
sekiro-game = { path = "../sekiro-rs/crates/game" }
sekiro-sim = { path = "../sekiro-rs/crates/sim" }
sekiro-formats = { path = "../sekiro-rs/crates/formats" }
sekiro-hks = { path = "../sekiro-rs/crates/hks" }

# Light optimization for our own code, so rebuilds stay fast.
[profile.dev]
opt-level = 1

# Full optimization for libraries (Bevy etc.). They are compiled once and
# cached, and without this the game runs very slowly in debug builds.
[profile.dev.package."*"]
opt-level = 3

# The packaged build (tools/package.ps1: `cargo build --profile dist`): whole-program
# optimisation and no symbols. Not the everyday `--release`, which stays quick to rebuild.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true

# Quick rebuilds for tests (`cargo test --profile quick`): release speed, but incremental, so
# after a small edit only the changed parts recompile. Not for performance measurements.
[profile.quick]
inherits = "release"
incremental = true
