# RustSekiro's combat core (no host feature) inside sekiro-rs's --map mode: see src/main.rs.
[package]
name = "in-sekiro-rs"
version = "0.1.0"
publish = false
edition = "2024"

[dependencies]
bevy = "0.20.0"
anyhow = "1"
# His game (lib sekiro_rs) and his collision.
sekiro-game = { path = "../../../sekiro-rs/crates/game" }
sekiro-sim = { path = "../../../sekiro-rs/crates/sim" }
# Our combat core alone (no host: no map, HUD, menus, sound).
rustsekiro = { package = "sv1", path = "../..", default-features = false }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
