[package]
name = "sekiro-sim"
description = "Bevy-free gameplay simulation: behaviour graph runtime and HKS-driven characters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
sekiro-formats.workspace = true
sekiro-hks = { path = "../hks" }
thiserror.workspace = true
glam.workspace = true
serde.workspace = true
serde_json.workspace = true

[features]
# Counts the grid entries queries visit (`collision::triangle_visits`), for the step cost tests.
visit-count = []

[dev-dependencies]
rayon.workspace = true
sekiro-sim = { path = ".", features = ["visit-count"] }
