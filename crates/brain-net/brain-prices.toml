# USD per million tokens, checked 2026-10-11. Standard text pricing, no tools.
# Sources: https://developers.openai.com/api/docs/models/gpt-6-luna
# https://developers.openai.com/api/docs/models/gpt-6.1-sol
# https://developers.openai.com/api/docs/pricing (standard, short context)
# https://developers.openai.com/api/docs/guides/decisions
# Decisions and Haiku rates: task-specified seeds (not independently verified).
# reasoning omitted means it is included in output; cached input is included in input.
# CLI subscription=true means plan usage, never billed USD, even if a CLI reports cost.
# Subscription CLI prices are never applied and no API-equivalent estimate is computed.

[backends.codex]
subscription = true
[backends.claude]
subscription = true

[[prices]]
model = "gpt-6-luna"
operation = "decisions"
input = 0.10
cached_input = 0.10
output = 0.0

[[prices]]
model = "gpt-6-luna"
operation = "responses"
input = 0.10
cached_input = 0.01
output = 0.50

[[prices]]
model = "gpt-6.1-sol"
operation = "responses"
input = 2.00
cached_input = 0.10
output = 10.00

[[prices]]
model = "claude-haiku-5-5"
operation = "responses"
input = 0.10
cached_input = 0.10 # TODO: verify Anthropic cache pricing; conservative input rate.
output = 0.50
