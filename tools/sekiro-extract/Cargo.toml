[package]
name = "sekiro-extract"
version = "0.2.0"
edition = "2024"
description = "Reads combat data (params, TAE, HKS) out of the user's own Sekiro install"

[dependencies]
aes = "0.8"
lewton = "0.10"
ogg = "0.8"
base64 = "0.22"
flate2 = "1"
num-bigint = "0.4"
libloading = "0.8"
roxmltree = "0.20"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# dds2png: BC1-7 decode (as AKJama/sekiro-rs does) and PNG out, for texture checks.
texture2ddecoder = "0.1"
png = "0.17"
bcdec_rs = "0.2.0"

[profile.dev]
opt-level = 3
