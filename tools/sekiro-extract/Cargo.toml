[package]
name = "sekiro-extract"
version = "0.1.0"
edition = "2024"
description = "Reads combat data (params, TAE, HKS) out of the user's own Sekiro install"

[dependencies]
aes = "0.8"
lewton = "0.10"
ogg = "0.8"
base64 = "0.22"
flate2 = "1"
num-bigint = "0.4"
libloading = "0.8"
roxmltree = "0.20"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 3
