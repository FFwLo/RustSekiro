[package]
name = "sv1-rec-hooks"
version = "0.1.0"
edition = "2021"
description = "me3 native DLL for the real Sekiro: logs calls of a few game functions for the rec2 recorder"

[lib]
name = "sv1_rec_hooks"
crate-type = ["cdylib"]

[dependencies]
ilhook = { version = "2.3.0", features = ["x64"] }

[profile.release]
panic = "abort"
opt-level = 2
